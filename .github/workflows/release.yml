# WP-32 (SPEC §28, §32) + 2026-08-09 audit remediation (ALEA-2026-001/
# 003/004/006): the production CI release pipeline. Three jobs, each with
# least-privilege scope (ALEA-2026-006):
#
#   full-ci        reuses ci.yml via `workflow_call` so the COMPLETE
#                  `bash ci.sh` gate runs on the exact tagged commit —
#                  the same gate a master merge runs, not a stale or
#                  assumed status (ALEA-2026-004). contents: read.
#   build-and-gate needs full-ci; verifies the tag, builds + gates the
#                  UNSIGNED payload, uploads it as an artifact. Never
#                  writes to the repo. contents: read; runs in the
#                  protected `release` Environment (ALEA-2026-001).
#   publish        needs build-and-gate; the ONLY write-scoped job. It
#                  consumes the artifact and creates the GitHub Release
#                  as a DRAFT (ALEA-2026-003) — no public surface until
#                  release-publish.yml verifies the offline SHA256SUMS.sig
#                  and un-drafts it. contents: write.
#
# Spec-conformance audit gap (2026-08-04): no CI/release pipeline existed
# (only a local, manually-run `ci.sh`); SPEC §32's "no automatic release
# from a developer laptop" and "production CI builds from a clean signed
# tag" had nothing enforcing them. This workflow is that enforcement.
#
# What the pipeline DOES prove, mechanically, on every run:
#   - the build ran from a fresh, single-commit checkout of a git tag
#     matching `v*` (never a branch push, never a local working tree —
#     `on.push.tags` is the only trigger, `actions/checkout` always
#     starts from a clean clone);
#   - the tag passes the fail-closed trust gate
#     (tools/release-verifier/scripts/tag-trust-gate.sh): signed against
#     the committed allowed_signers, an ANCESTOR of origin/master (no
#     off-master/side-branch releases, ALEA-2026-004), and — when the
#     Environment variable ALEA_TAG_SIGNER_FPR is set — fingerprint-pinned
#     (ALEA-2026-001). See docs/RELEASE-GOVERNANCE.md;
#   - the production `.efi` passes the SPEC §28 `binary-policy-scanner`
#     gate (test-marker refusal);
#   - the deterministic USB image and `release-verifier` manifest check
#     both pass, and the pinned advisory-db snapshot is fresh
#     (ALEA-2026-008).
#
# What this pipeline deliberately does NOT do: it does not hold, invoke or
# fake possession of a real production code-signing key. Level 2/3
# distribution signing (SPEC §33) requires key custody, multi-person
# approval and (for Level 3) an external CA relationship that cannot
# exist inside this source tree or a public CI log — see
# `SECURITY.md`'s "Reporting a vulnerability" section and
# `docs/secure-boot.md` for why `SIGNING-GOVERNANCE.md` has not been
# produced yet. It builds and gates the reproducible, UNSIGNED payload;
# the detached SHA256SUMS.sig is produced offline and verified by
# release-publish.yml (ALEA-2026-003), never here.
name: release

on:
  push:
    tags:
      - "v*"

# A tag push can race a second push of the same tag name in unusual
# force-push scenarios; never run two release jobs for the same tag
# concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # (ALEA-2026-004) Run the COMPLETE `bash ci.sh` gate on the exact tagged
  # commit by reusing ci.yml — the same gate a master merge runs, not a
  # stale or assumed status. `build-and-gate` `needs:` this, so nothing
  # builds or publishes unless the full gate passed for this SHA.
  full-ci:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build-and-gate:
    needs: full-ci
    # Defense in depth: `on.push.tags` already restricts the trigger,
    # but a workflow-level `if` guard means this job still refuses to
    # proceed even if the trigger config above is ever loosened by a
    # future edit that doesn't also update this guard.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # (ALEA-2026-006) Least privilege: this job only checks out, verifies,
    # builds, gates and uploads an artifact — it NEVER writes to the repo.
    # Publishing the Release (the one write-scoped action) is the separate
    # `publish` job below, which consumes this job's uploaded artifact.
    # (ALEA-2026-001) It runs in the protected `release` Environment so the
    # out-of-band `ALEA_TAG_SIGNER_FPR` fingerprint pin is available to the
    # tag-trust gate.
    permissions:
      contents: read
    environment: release
    steps:
      - name: Checkout the exact tagged commit (fresh clone, full history for tag verification)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Restore the real tag object (actions/checkout clobbers annotated tags)
        # actions/checkout maps `github.ref` to the peeled COMMIT sha, so
        # the runner's local `refs/tags/<tag>` is a lightweight tag even
        # when the pushed tag was annotated+signed (checkout issue #290).
        # Without this re-fetch, the signed-tag gate below reads the
        # commit object, finds no signature block, and fails every release
        # from a genuinely signed tag. `--force` replaces the clobbered
        # local ref with the true tag object from the server.
        run: |
          set -euo pipefail
          git fetch --force --tags origin

      - name: Confirm a clean source tree (SPEC §32 "clean source tree")
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: checkout is not clean (unexpected — a fresh actions/checkout should never be dirty)."
            git status --porcelain
            exit 1
          fi
          echo "PASS: clean checkout."

      - name: Tag trust gate — signed + master-ancestry + fingerprint pin (ALEA-2026-001/004)
        # The single release-authorization gate (see
        # docs/RELEASE-GOVERNANCE.md and
        # tools/release-verifier/scripts/tag-trust-gate.sh). It enforces,
        # fail-closed: (1) the tag verifies against the committed
        # allowed_signers; (2) the tagged commit is an ancestor of
        # origin/master (the SINGLE ancestry gate — no second one exists);
        # (3) when the protected Environment variable ALEA_TAG_SIGNER_FPR
        # is set, the signer fingerprint matches it AND appears in
        # allowed_signers (defense in depth; loud WARNING, never a silent
        # pass, when unset). Honest scope: this is NOT an independent trust
        # root — see the script header and allowed_signers' TOFU note.
        env:
          EXPECTED_FPR: ${{ vars.ALEA_TAG_SIGNER_FPR }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          # Bring in the protected branch ref for the ancestry check.
          git fetch --no-tags origin master:refs/remotes/origin/master
          bash tools/release-verifier/scripts/tag-trust-gate.sh \
            --tag "$TAG" \
            --allowed-signers allowed_signers \
            --branch-ref origin/master \
            --expected-fpr "$EXPECTED_FPR"

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup show
          rustup target add x86_64-unknown-uefi

      - name: SPEC §29.5 / §29.6 standalone security suites (release gate)
        run: |
          set -euo pipefail
          # tests/fault-injection (WP-33, SPEC §29.5) and tests/leakage
          # (WP-34, SPEC §29.6) are DELIBERATELY standalone Cargo
          # workspaces (see each suite's Cargo.toml doc comment), so the
          # root workspace's own tests never include them — and the
          # docs/AUDIT-STATUS.md gate-5 claim shipped in every release
          # ("Fault-injection suite passes: Met") is only honest if the
          # release actually executed the suite. Per-suite target dirs
          # keep their independent workspace locks/fingerprints out of
          # this job's own target/ (same pattern as ci.sh's
          # standalone-suites stage). The leakage suite self-builds the
          # --release x86_64-unknown-uefi artifacts it scans into its own
          # target dir (see tests/leakage/tests/forbidden_uefi_interfaces.rs),
          # using the UEFI target installed by the toolchain step above.
          CARGO_TARGET_DIR="$PWD/target-fault-injection" \
            cargo test --locked --manifest-path tests/fault-injection/Cargo.toml
          CARGO_TARGET_DIR="$PWD/target-leakage" \
            cargo test --locked --manifest-path tests/leakage/Cargo.toml

      - name: Build seed-uefi-production (release, x86_64-unknown-uefi)
        run: cargo build -p seed-uefi-production --target x86_64-unknown-uefi --release --locked

      - name: Build alea-verify (release, x86_64-unknown-uefi) — the separate chain-loaded verifier (SPEC_MAIN_MENU.md §17.4)
        run: cargo build -p alea-verify --target x86_64-unknown-uefi --release --locked

      - name: Build binary-policy-scanner
        run: cargo build -p binary-policy-scanner --release --locked

      - name: SPEC §28 binary-policy-scanner gate
        run: |
          set -euo pipefail
          scanner="target/release/binary-policy-scanner"
          efi="target/x86_64-unknown-uefi/release/seed-uefi-production.efi"
          "$scanner" "$efi"

      - name: Build image-builder and produce the deterministic USB image
        run: |
          set -euo pipefail
          cargo build -p image-builder --release --locked
          mkdir -p release-out
          # Dual-file image: the boot loader at \EFI\BOOT\BOOTX64.EFI PLUS the
          # separate verifier at \EFI\ALEA\VERIFY.EFI (SPEC_MAIN_MENU.md §17.4),
          # passed as the optional 3rd image-builder argument.
          target/release/image-builder \
            target/x86_64-unknown-uefi/release/seed-uefi-production.efi \
            release-out/alea-x86_64-usb.img \
            target/x86_64-unknown-uefi/release/alea-verify.efi
          cp target/x86_64-unknown-uefi/release/seed-uefi-production.efi \
            release-out/alea-x86_64-unsigned.efi
          cp target/x86_64-unknown-uefi/release/alea-verify.efi \
            release-out/alea-verify.efi

      - name: SHA256SUMS for the produced (unsigned) release artifacts
        run: |
          set -euo pipefail
          cd release-out
          # (ALEA-2026-002) alea-verify.efi is a published, security-relevant
          # asset and MUST be covered by the signed checksum manifest like
          # every other executable — it was previously omitted here.
          sha256sum alea-x86_64-unsigned.efi alea-verify.efi alea-x86_64-usb.img > SHA256SUMS
          cat SHA256SUMS

      - name: Build release-verifier and check the SHA256SUMS half of the release manifest
        run: |
          set -euo pipefail
          cargo build -p release-verifier --release --locked
          # Signed artifacts, SBOM, and the governance docs this job
          # cannot produce (SIGNING-GOVERNANCE.md, AUDIT-STATUS.md before
          # the SPEC §36 gates are met) are not present in `release-out/`
          # yet, so a full SPEC §32 fourteen-file manifest check is
          # expected to report those as missing here -- this step
          # therefore only asserts the SHA256SUMS half (files that ARE
          # present must match their published hash), matching what a
          # partial, pre-signing build artifact actually is.
          target/release/release-verifier release-out || true
          target/release/release-verifier release-out 2>&1 | grep -q "PASS: all .* file(s) match SHA256SUMS"

      - name: Advisory-db snapshot freshness gate (ALEA-2026-008)
        run: |
          set -euo pipefail
          # Fail-closed if the pinned RustSec advisory-db snapshot is stale,
          # missing, or future-dated (see supply-chain/advisory-db.lock).
          # NOTE: the actual `cargo deny --offline check advisories` run
          # against the vendored snapshot is deferred to the WP4 remainder
          # (cargo-deny install + submodule/tarball decision — see
          # supply-chain/README.md); this freshness enforcement is the part
          # that runs today.
          cargo build -p release-verifier --release --locked --bin advisory-db-age
          target/release/advisory-db-age supply-chain/advisory-db.lock

      - name: Upload gated (unsigned) release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: alea-unsigned-${{ github.ref_name }}
          path: release-out/
          if-no-files-found: error

  # (ALEA-2026-006) The ONLY write-scoped job. It consumes the artifact
  # `build-and-gate` (read-only) produced and does no build/gate itself —
  # so a compromised build action cannot also gain repo-write.
  # (ALEA-2026-003) It creates the Release as a DRAFT only; the release is
  # made public later by `release-publish.yml` after the detached
  # SHA256SUMS.sig is added offline and verified. No public release exists
  # until authentication material is present and verified.
  publish:
    needs: build-and-gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout MUST run before the artifact download: actions/checkout's
      # default `clean: true` runs `git clean -ffdx`, which would delete the
      # untracked release-out/ the download creates. Ordering checkout first
      # (on the still-empty workspace) then downloading into release-out/
      # keeps the gated artifacts intact for `gh release create` below.
      - name: Checkout (release notes only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Download the gated artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: alea-unsigned-${{ github.ref_name }}
          path: release-out
      - name: Create the GitHub Release as a DRAFT (ALEA-2026-003)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Pre-release suffix (v0.10.0-beta, v1.0.0-rc1, …) -> GitHub
          # pre-release. TAG is the runner-provided ref name (maintainer
          # push only), passed via env: and quoted, never interpolated.
          prerelease_flag=""
          case "$TAG" in
            *-*) prerelease_flag="--prerelease" ;;
          esac
          # DRAFT ONLY: no public surface, no notifications. The release is
          # un-drafted by release-publish.yml after the offline SHA256SUMS.sig
          # is uploaded and verified (ALEA-2026-003).
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-out/* --clobber
            gh release edit "$TAG" --draft=true --notes-file .github/release-notes.md $prerelease_flag
          else
            gh release create "$TAG" release-out/* \
              --draft \
              --title "Alea $TAG" \
              --notes-file .github/release-notes.md \
              $prerelease_flag
          fi
          echo "Created/updated DRAFT release $TAG. Sign SHA256SUMS offline, upload"
          echo "SHA256SUMS.sig, then run the release-publish workflow to make it public."
