[package]
name = "seed-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# `#![no_std]`, no `alloc` (SPEC §13). Depends only on the pinned hashing
# primitives its own modules wrap (WP-01/02) plus `zeroize` for the secret
# arena (WP-09).
[dependencies]
sha2 = { workspace = true }
hmac = { workspace = true }
pbkdf2 = { workspace = true }
ripemd = { workspace = true }
zeroize = { workspace = true }
