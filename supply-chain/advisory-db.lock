# Pinned RustSec advisory-db snapshot for the deterministic offline
# release advisory gate (ALEA-2026-008). See supply-chain/README.md.
#
# `commit` is the rustsec/advisory-db commit the offline release gate
# (`cargo deny --offline check advisories`, WP4) checks against.
# `snapshot_date` is that commit's date; `advisory-db-age` fails the
# release closed if today is more than `max_age_days` past it, so a
# stale pin cannot silently stop catching new advisories. Bump both
# fields (and the vendored snapshot itself) together when refreshing.
#
# RESOLVED (Grok 4.5 Expert audit F-06, 2026-08-11): rather than vendor the
# whole advisory-db into the repo (submodule or tarball — both bloat clones),
# CI FETCHES the advisory-db and PINS it to `commit` below, verifying the SHA
# before use. `tools/release-verifier/scripts/advisory-check.sh` runs the
# freshness gate (advisory-db-age) + the fetch/pin/verify + `cargo deny
# --offline check advisories`, wired into ci.sh (and thus every release via
# the full-ci job). Determinism comes from the verified pin; no in-repo
# vendoring. Bump `commit`/`snapshot_date` together when refreshing the pin.

commit = "565436d86a136c840d01ad4a7851fc7391295404"
snapshot_date = "2026-08-09"
max_age_days = 30
