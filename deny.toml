# cargo-deny configuration — ADVISORIES ONLY (ALEA-2026-008).
#
# This file scopes cargo-deny strictly to RustSec security-advisory
# checking. It deliberately does NOT configure [bans], [licenses], or
# [sources]: dependency pinning, allowed sources, and the review/exemption
# record are already owned by `cargo vet` (supply-chain/) and the SPEC §31
# dependency-policy checker (tools/release-verifier). Duplicating them here
# would create two disagreeing sources of truth. cargo-deny is added ONLY
# to answer the one question cargo vet does not: "does the resolved
# Cargo.lock contain a version with a *newly published* RustSec advisory?"
#
# Two-tier usage (see supply-chain/README.md):
#   - scheduled ONLINE monitor  → `cargo deny check advisories` vs the live DB
#   - deterministic RELEASE gate → `cargo deny --offline check advisories`
#     against the pinned snapshot (supply-chain/advisory-db.lock), guarded
#     by `advisory-db-age` so the pinned snapshot cannot drift stale.
#
# Honesty: a green advisory check proves only "no RustSec advisory matches
# the pinned graph as of the snapshot date." It is NOT an audit, NOT a
# safety attestation, and does not change Alea's EXPERIMENTAL / unaudited /
# not-for-substantial-funds posture. An `ignore`d advisory below is an
# explicit, documented acknowledgement — never a safety claim.

[advisories]
# Fail on any security advisory or unmaintained/unsound notice in the
# resolved graph. `yanked = "deny"` also rejects a yanked crate version.
version = 2
yanked = "deny"
# Deterministic db location (repo-relative, inside the gitignored target/):
# tools/release-verifier/scripts/advisory-check.sh fetches the advisory-db
# here, pins it to supply-chain/advisory-db.lock's commit + verifies the
# SHA, then runs `cargo deny --offline check advisories` against it. Fixing
# the path here (rather than cargo-deny's per-user cache default) is what
# lets the script find, pin, and verify the exact snapshot (ALEA-2026-008
# remainder / audit finding F-06).
db-path = "target/advisory-db"
# Every entry MUST carry the advisory ID, why it does not apply (or the
# accepted risk), and a review date — mirroring the honesty discipline of
# supply-chain/audits.toml. An entry is a documented acknowledgement, never
# a safety claim.
ignore = [
    # RUSTSEC-2026-0192 — `ttf-parser` is UNMAINTAINED (an upstream
    # maintenance notice, NOT a security vulnerability: no CVE, and upstream
    # states "no safe upgrade available"). It is reachable ONLY through the
    # desktop *rehearsal* edition's GUI stack
    # (seed-desktop-test → winit → sctk-adwaita → ab_glyph → ttf-parser) —
    # a watermarked, public-test-vectors-only, never-a-real-generator build.
    # It is NOT in the production UEFI binary (`cargo tree -p
    # seed-uefi-production -i ttf-parser` finds no match; the seed-uefi-
    # production/seed-desktop-test isolation is enforced by ci.sh) and NOT on
    # any entropy/secret path. Accepted, font-parsing-in-a-rehearsal-window
    # scope. Reviewed 2026-08-11 (Grok 4.5 Expert audit F-06).
    { id = "RUSTSEC-2026-0192", reason = "unmaintained (not a vuln); desktop-rehearsal GUI font parser only, absent from the production binary; reviewed 2026-08-11" },
]
